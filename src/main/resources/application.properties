spring.application.name=api-bazar
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bazar?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:tu_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Umbral de stock bajo (requerimiento 4)
bazar.stock.minimo=5
